    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Fashion Mnist Image Upload</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body {
                background: linear-gradient(135deg, #6a11cb, #2575fc);


                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .card {
                border-radius: 10px;
            }
            .preview-img {
                border-radius: 10px;
                border: 2px solid #ddd;
            }
        </style>

    </head>
    <body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow-lg p-4">
                    <h2 class="text-center mb-4">Upload Image</h2>

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Choose Image</label>
                            <input type="file" name="image" class="form-control">
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Upload & Predict
                            </button>
                        </div>
                    </form>

                    {% if image_url %}
                    <hr>

                    <div class="text-center">
                        <h5 class="mb-3">Uploaded Image</h5>
                        <img src="{{ image_url }}" class="img-fluid preview-img" width="250">

                        {% if prediction is not None %}
                            <div class="alert alert-success mt-3">
                                <strong>Predict Emotions:</strong> {{ prediction }}
                            </div>
                        {% endif %}
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
    </body>
    </html>
